<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Vintage Journal Excel-Sync Tracker</title>
    <style>
        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #f4eae1; /* Creamy parchment background */
            font-family: 'Courier New', Courier, Georgia, serif;
            color: #4a3b32; /* Warm dark roasted coffee brown text */
            overflow: auto;
        }
        body { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; box-sizing: border-box; }
        
        .dashboard { 
            background: #faf4ee; 
            padding: 24px; 
            border-radius: 4px; 
            border: 1px solid #d2b48c; /* Tan/Light brown border */
            box-shadow: 0 4px 20px rgba(74, 59, 50, 0.08);
            width: 100%; 
            max-width: 1300px; 
            box-sizing: border-box; 
            display: flex;
            flex-direction: row;
            gap: 24px;
            align-items: stretch;
        }
        
        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
            min-width: 220px;
        }

        .right-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        h2 {
            margin: 0 0 10px 0;
            font-size: 16px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #6e5546;
        }

        .total-display { 
            font-size: 22px; 
            font-weight: normal; 
            color: #4a3b32; 
            margin: 0 0 20px 0; 
            border-bottom: 1px dashed #d2b48c;
            padding-bottom: 12px;
        }

        .sync-status {
            font-size: 11px;
            font-style: italic;
            color: #8c6d53;
            margin-bottom: 15px;
        }
        
        .controls { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        
        input, button { 
            padding: 12px; 
            border-radius: 3px; 
            font-size: 15px; 
            font-family: inherit;
            -webkit-appearance: none; 
            box-sizing: border-box;
            width: 100%;
        }
        input { 
            background: #ffffff; 
            color: #4a3b32; 
            border: 1px solid #c2a688;
            text-align: center;
        }
        input::placeholder { color: #bca085; font-style: italic; }
        input:focus { outline: none; border-color: #8c6d53; background: #fffcf9; }
        
        button { 
            background: #8c6d53; 
            color: #ffffff; 
            font-weight: bold; 
            border: 1px solid #70543e;
            cursor: pointer; 
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        button:disabled { background: #bca085; cursor: not-allowed; }
        button:active { background: #70543e; }
        
        .chart-container { 
            position: relative; 
            height: 360px; 
            width: 100%; 
            background-color: #fdfbf7;
            border: 1px solid #c2a688; 
            border-radius: 2px;
            box-sizing: border-box;
        }
        
        canvas { 
            width: 100%; 
            height: 100%; 
            display: block;
        }

        @media (max-width: 800px) {
            .dashboard {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="dashboard">
        <div class="left-panel">
            <h2>Excel Live Sync</h2>
            <div class="total-display">Amount: <span id="valueDisplay">0.00</span></div>
            <div id="statusIndicator" class="sync-status">Connecting to live cloud sheet...</div>
            <div class="controls">
                <input type="number" step="any" inputmode="decimal" id="amountInput" placeholder="input data..." onkeydown="checkEnterKey(event)">
                <button id="recordBtn" onclick="calculateAndPlot()">Record</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="chart-container">
                <canvas id="liveChart" width="650" height="460"></canvas>
            </div>
        </div>
    </div>

    <script>
        const EXCEL_API_URL = "https://api.sheetbest.com/sheets/e3d325d4-9435-4723-bb4f-83ee9d0cb7b8"; 
		
		console.log("App initialized with API URL: " + EXCEL_API_URL);

        let inputHistory = new Array();
        const canvas = document.getElementById('liveChart');
        const ctx = canvas.getContext('2d');

        window.onload = function() {
            // FIXED: Removed the logic trap that was checking against your active URL string
            if(EXCEL_API_URL === "" || EXCEL_API_URL.includes("YOUR_EXCEL_API")) {
                document.getElementById('statusIndicator').textContent = "⚠️ Add your Excel API URL on line 125.";
                clearAndDrawGridStructure();
                return;
            }
            loadDataFromExcel();
        };

        function loadDataFromExcel() {
            document.getElementById('statusIndicator').textContent = "🔄 Downloading tracking row segments...";
            console.log("Fetching live data from Sheet Best...");
            
            fetch(EXCEL_API_URL)
                .then(response => response.json())
                .then(data => {
                    console.log("Raw payload received from Sheet Best:", data);
                    
                    // Convert row data objects directly to pure numbers
                    inputHistory = data.map(row => {
                        let parsed = parseFloat(row.amount);
                        return isNaN(parsed) ? null : parsed;
                    }).filter(val => val !== null);
                    
                    console.log("Filtered clean numerical history:", inputHistory);
                    
                    if (inputHistory.length > 0) {
                        const lastValue = inputHistory[inputHistory.length - 1];
                        document.getElementById('valueDisplay').textContent = lastValue.toFixed(2);
                    }
                    
                    document.getElementById('statusIndicator').textContent = "✅ Cloud sheet synchronized.";
                    clearAndDrawGridStructure();
                    renderNativeCanvasPointsLines();
                })
                .catch(error => {
                    console.error("Fetch Error details:", error);
                    document.getElementById('statusIndicator').textContent = "❌ Connection failed. Check sheet settings.";
                    clearAndDrawGridStructure();
                });
        }

        function clearAndDrawGridStructure() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(210, 180, 140, 0.25)';
            ctx.lineWidth = 1;
            for (let x = 20; x < canvas.width; x += 30) {
                ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            }
            for (let y = 20; y < canvas.height; y += 30) {
                ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke();
            }
            ctx.strokeStyle = 'rgba(140, 109, 83, 0.5)';
            ctx.lineWidth = 1.5;
            ctx.beginPath(); ctx.moveTo(20, canvas.height - 20); ctx.lineTo(canvas.width - 20, canvas.height - 20); ctx.stroke();
        }

        function checkEnterKey(event) {
            if (event.key === "Enter") {
                event.preventDefault(); 
                calculateAndPlot();
            }
        }

        function drawPrecisionHandDrawnLine(x1, y1, x2, y2) {
            ctx.strokeStyle = '#5c4033'; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
            const midX = (x1 + x2) / 2; const midY = (y1 + y2) / 2;
            const jitterScale = 0.5; 
            const offsetChangeX = (Math.random() - 0.5) * jitterScale; 
            const offsetChangeY = (Math.random() - 0.5) * jitterScale;
            ctx.beginPath(); 
            ctx.moveTo(x1, y1); 
            ctx.quadraticCurveTo(midX + offsetChangeX, midY + offsetChangeY, x2, y2); 
            ctx.stroke(); // FIXED: Closed out function completely to prevent layout parse breaks
        }

        function calculateAndPlot() {
            const input = document.getElementById('amountInput');
            const btn = document.getElementById('recordBtn');
            const enteredAmount = parseFloat(input.value);

            if (!isNaN(enteredAmount)) {
                input.disabled = true;
                btn.disabled = true;
                document.getElementById('statusIndicator').textContent = "📤 Broadcasting entry to Google Sheets...";
                console.log("Posting value to Google Sheets via API:", enteredAmount);

                fetch(EXCEL_API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ amount: enteredAmount }) 
                })
                .then(response => response.json())
                .then(result => {
                    console.log("Post request successful. API Result:", result);
                    inputHistory.push(enteredAmount);
                    document.getElementById('valueDisplay').textContent = enteredAmount.toFixed(2);
                    document.getElementById('statusIndicator').textContent = "✅ Google Sheet Saved.";
                    
clearAndDrawGridStructure();renderNativeCanvasPointsLines();input.value = '';input.disabled = false;btn.disabled = false;input.focus();}).catch(error => {console.error("POST Network Error:", error);document.getElementById('statusIndicator').textContent = "❌ Failed to save. Network issue.";input.disabled = false;btn.disabled = false;input.focus();});} else {input.focus();}}function renderNativeCanvasPointsLines() {if (inputHistory.length === 0) return;const padding = 30;const chartWidth = canvas.width - (padding * 2);const chartHeight = canvas.height - (padding * 2);let maxVal = Math.max(...inputHistory);if (maxVal === 0) maxVal = 10;const points = inputHistory.map((val, index) => {const x = padding + (index * (chartWidth / Math.max(inputHistory.length - 1, 1)));const y = (canvas.height - padding) - ((val / maxVal) * chartHeight);return { x: x, y: y };});for (let i = 0; i < points.length - 1; i++) {drawPrecisionHandDrawnLine(points[i].x, points[i].y, points[i+1].x, points[i+1].y);}points.forEach(pt => {ctx.fillStyle = '#b87333'; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2); ctx.fill();ctx.strokeStyle = '#5c4033'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(pt.x, pt.y, 3.5, 0, Math.PI * 2); ctx.stroke();});}
